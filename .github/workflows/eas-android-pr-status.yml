name: KHE Booth Android EAS Status

on:
  pull_request:
    types: [synchronize, labeled]

permissions:
  contents: read

jobs:
  eas-status:
    name: Read latest Android EAS build
    if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'eas-status')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link existing Expo project
        working-directory: apps/mobile
        run: eas init --account kurtis-hypnotic-event --non-interactive --force

      - name: Read latest Android build safely
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          eas build:list --platform android --limit 1 --json --non-interactive > /tmp/eas-list.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/eas-list.json', 'utf8'));
          const build = Array.isArray(payload) ? payload[0] : payload;
          if (!build?.id) throw new Error('No Android EAS build found');
          const owner = build.project?.ownerAccount?.name || 'kurtis-hypnotic-event';
          const slug = build.project?.slug || 'kurtis-hypnotic-events';
          console.log(`EAS_BUILD_ID=${build.id}`);
          console.log(`EAS_STATUS=${build.status || 'UNKNOWN'}`);
          console.log(`EAS_GIT_COMMIT=${build.gitCommitHash || 'unknown'}`);
          console.log(`EAS_BUILD_PROFILE=${build.buildProfile || 'unknown'}`);
          console.log(`EAS_CREATED_AT=${build.createdAt || 'unknown'}`);
          console.log(`EAS_COMPLETED_AT=${build.completedAt || 'pending'}`);
          console.log(`EAS_ARTIFACT_URL=${build.artifacts?.buildUrl || 'pending'}`);
          console.log(`EAS_BUILD_URL=https://expo.dev/accounts/${owner}/projects/${slug}/builds/${build.id}`);
          NODE
