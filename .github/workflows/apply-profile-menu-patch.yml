name: Apply profile menu patch

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-profile-menu-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/apply-profile-menu-patch.mjs
      - name: Commit patch
        run: |
          if git diff --quiet -- apps/mobile/src/main.tsx; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/main.tsx
          git commit -m "feat(mobile): wire profile and print menu"
          git push origin HEAD:main
