name: KHE Booth Mobile CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-ci.yml'
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-ci.yml'
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'

concurrency:
  group: khe-booth-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @khe/contracts build

      - name: Typecheck mobile
        run: pnpm --filter @khe/mobile lint

      - name: Test offline foundation
        run: pnpm --filter @khe/mobile test

      - name: Verify Expo production and beta identities
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          pnpm exec expo config --json > /tmp/khe-expo-production.json
          KHE_ANDROID_CHANNEL=beta pnpm exec expo config --json > /tmp/khe-expo-beta.json
          node <<'NODE'
          const fs = require('fs');
          const production = JSON.parse(fs.readFileSync('/tmp/khe-expo-production.json', 'utf8'));
          const beta = JSON.parse(fs.readFileSync('/tmp/khe-expo-beta.json', 'utf8'));
          if (production.android?.package !== 'com.kurtishypnotic.khebooth') throw new Error(`Unexpected production package: ${production.android?.package}`);
          if (production.name !== 'KHE Booth') throw new Error(`Unexpected production app name: ${production.name}`);
          if (beta.android?.package !== 'com.kurtishypnotic.khebooth.beta') throw new Error(`Unexpected beta package: ${beta.android?.package}`);
          if (beta.name !== 'KHE Booth Beta') throw new Error(`Unexpected beta app name: ${beta.name}`);
          console.log('Android identities verified:', production.android.package, beta.android.package);
          NODE

      - name: Validate Android native prebuild
        working-directory: apps/mobile
        env:
          CI: '1'
          KHE_ANDROID_CHANNEL: beta
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Verify Android beta package identity
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          grep -Eq "applicationId[[:space:]]+['\"]com\.kurtishypnotic\.khebooth\.beta['\"]" android/app/build.gradle
          grep -q '<string name="app_name">KHE Booth Beta</string>' android/app/src/main/res/values/strings.xml
          grep -q 'KHE_PREVIEW_STREAM_READY' node_modules/expo-camera/android/src/main/java/expo/modules/camera/ExpoCameraView.kt

      - name: Compile Android standalone ARM32 and ARM64 beta APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon --stacktrace

      - name: Verify embedded JavaScript bundle
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APK_BYTES=$(stat -c%s "$APK")
          MAX_BYTES=$((190 * 1024 * 1024))
          if [ "$APK_BYTES" -gt "$MAX_BYTES" ]; then
            echo "Standalone ARM32/ARM64 APK is unexpectedly large: $APK_BYTES bytes" >&2
            exit 1
          fi
          unzip -l "$APK" | grep -Eq 'assets/(index\.android\.bundle|expo-router|.*\.bundle)' || {
            echo "Standalone APK does not contain an embedded JS bundle" >&2
            exit 1
          }

      - name: Package ZIP fallback for older Android download managers
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"
          cp "$APK_DIR/app-release.apk" "$APK_DIR/KHE-Booth-Android-Standalone.apk"
          cd "$APK_DIR"
          zip -9 KHE-Booth-Android-Standalone.zip KHE-Booth-Android-Standalone.apk

      - name: Upload Android standalone APK and ZIP fallback
        uses: actions/upload-artifact@v4
        with:
          name: khe-booth-android-standalone
          path: |
            apps/mobile/android/app/build/outputs/apk/release/KHE-Booth-Android-Standalone.apk
            apps/mobile/android/app/build/outputs/apk/release/KHE-Booth-Android-Standalone.zip
          if-no-files-found: error
          retention-days: 7

      - name: Build mobile TypeScript
        run: pnpm --filter @khe/mobile build

  publish-android-release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/android-'))
    needs: validate-mobile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated Android APK
        uses: actions/download-artifact@v4
        with:
          name: khe-booth-android-standalone
          path: android-release

      - name: Publish stable Android beta release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK_SOURCE="android-release/KHE-Booth-Android-Standalone.apk"
          ZIP_SOURCE="android-release/KHE-Booth-Android-Standalone.zip"
          APK_RELEASE="KHE-Booth-Android-Standalone.apk"
          ZIP_RELEASE="KHE-Booth-Android-Standalone.zip"
          cp "$APK_SOURCE" "$APK_RELEASE"
          cp "$ZIP_SOURCE" "$ZIP_RELEASE"

          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$APK_RELEASE" "$ZIP_RELEASE" --clobber
            gh release edit android-latest \
              --prerelease \
              --title "KHE Booth Android — bêta autonome" \
              --notes "APK Android bêta autonome ARM32/ARM64 avec bundle JavaScript embarqué. Si Chrome bloque à la fin du téléchargement APK, utilisez le fichier ZIP de secours puis extrayez-le avec Mes fichiers. Package : com.kurtishypnotic.khebooth.beta."
          else
            gh release create android-latest "$APK_RELEASE" "$ZIP_RELEASE" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "KHE Booth Android — bêta autonome" \
              --notes "APK Android bêta autonome ARM32/ARM64 avec bundle JavaScript embarqué. Si Chrome bloque à la fin du téléchargement APK, utilisez le fichier ZIP de secours puis extrayez-le avec Mes fichiers. Package : com.kurtishypnotic.khebooth.beta."
          fi
