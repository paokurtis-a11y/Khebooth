name: KHE Booth Mobile CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-ci.yml'
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-ci.yml'
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'

concurrency:
  group: khe-booth-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @khe/contracts build

      - name: Typecheck mobile
        run: pnpm --filter @khe/mobile lint

      - name: Test offline foundation
        run: pnpm --filter @khe/mobile test

      - name: Validate Android native prebuild
        working-directory: apps/mobile
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Compile Android native debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khe-booth-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build mobile TypeScript
        run: pnpm --filter @khe/mobile build
