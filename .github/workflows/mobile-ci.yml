name: KHE Booth Mobile CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-ci.yml'
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-ci.yml'
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'

concurrency:
  group: khe-booth-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @khe/contracts build

      - name: Typecheck mobile
        run: pnpm --filter @khe/mobile lint

      - name: Test offline foundation
        run: pnpm --filter @khe/mobile test

      - name: Verify Expo production and beta identities
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          pnpm exec expo config --json > /tmp/khe-expo-production.json
          KHE_ANDROID_CHANNEL=beta pnpm exec expo config --json > /tmp/khe-expo-beta.json
          node <<'NODE'
          const fs = require('fs');
          const production = JSON.parse(fs.readFileSync('/tmp/khe-expo-production.json', 'utf8'));
          const beta = JSON.parse(fs.readFileSync('/tmp/khe-expo-beta.json', 'utf8'));
          if (production.android?.package !== 'com.kurtishypnotic.khebooth') {
            throw new Error(`Unexpected production package: ${production.android?.package}`);
          }
          if (production.name !== 'KHE Booth') {
            throw new Error(`Unexpected production app name: ${production.name}`);
          }
          if (beta.android?.package !== 'com.kurtishypnotic.khebooth.beta') {
            throw new Error(`Unexpected beta package: ${beta.android?.package}`);
          }
          if (beta.name !== 'KHE Booth Beta') {
            throw new Error(`Unexpected beta app name: ${beta.name}`);
          }
          console.log('Android identities verified:', production.android.package, beta.android.package);
          NODE

      - name: Validate Android native prebuild
        working-directory: apps/mobile
        env:
          CI: '1'
          KHE_ANDROID_CHANNEL: beta
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Verify Android beta package identity
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          grep -Eq "applicationId[[:space:]]+['\"]com\.kurtishypnotic\.khebooth\.beta['\"]" android/app/build.gradle
          grep -q '<string name="app_name">KHE Booth Beta</string>' android/app/src/main/res/values/strings.xml

      - name: Compile Android native debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khe-booth-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build mobile TypeScript
        run: pnpm --filter @khe/mobile build

  publish-android-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-mobile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated Android APK
        uses: actions/download-artifact@v4
        with:
          name: khe-booth-android-debug
          path: android-release

      - name: Publish stable Android beta release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK_SOURCE="android-release/app-debug.apk"
          APK_RELEASE="KHE-Booth-Android-debug.apk"
          cp "$APK_SOURCE" "$APK_RELEASE"

          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$APK_RELEASE" --clobber
            gh release edit android-latest \
              --prerelease \
              --title "KHE Booth Android — bêta" \
              --notes "APK Android bêta généré automatiquement depuis main après validation native. Le package bêta com.kurtishypnotic.khebooth.beta est distinct de la production et peut être installé à côté d’une ancienne KHE Booth sans conflit de package."
          else
            gh release create android-latest "$APK_RELEASE" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "KHE Booth Android — bêta" \
              --notes "APK Android bêta généré automatiquement depuis main après validation native. Le package bêta com.kurtishypnotic.khebooth.beta est distinct de la production et peut être installé à côté d’une ancienne KHE Booth sans conflit de package."
          fi
