name: KHE Booth Mobile CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-ci.yml'
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-ci.yml'
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'

concurrency:
  group: khe-booth-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @khe/contracts build

      - name: Typecheck mobile
        run: pnpm --filter @khe/mobile lint

      - name: Test offline foundation
        run: pnpm --filter @khe/mobile test

      - name: Validate Android native prebuild
        working-directory: apps/mobile
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Compile Android native debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khe-booth-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish stable Android beta release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_SOURCE="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          APK_RELEASE="KHE-Booth-Android-debug.apk"
          cp "$APK_SOURCE" "$APK_RELEASE"

          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$APK_RELEASE" --clobber
            gh release edit android-latest \
              --title "KHE Booth Android — bêta" \
              --notes "APK Android de test généré automatiquement depuis la branche main. Ce canal reste stable pendant que la signature de production est préparée."
          else
            gh release create android-latest "$APK_RELEASE" \
              --target "$GITHUB_SHA" \
              --title "KHE Booth Android — bêta" \
              --notes "APK Android de test généré automatiquement depuis la branche main. Ce canal reste stable pendant que la signature de production est préparée."
          fi

      - name: Build mobile TypeScript
        run: pnpm --filter @khe/mobile build
