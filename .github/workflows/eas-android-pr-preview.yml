name: KHE Booth Android PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - apps/mobile/**
      - .github/workflows/eas-android-pr-preview.yml

permissions:
  contents: read

concurrency:
  group: khe-booth-android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-android-preview:
    name: Submit Android preview APK
    if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'eas-build-android:preview')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Expo configuration
        working-directory: apps/mobile
        run: pnpm exec expo config --json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link existing Expo project
        working-directory: apps/mobile
        env:
          EXPO_DEBUG: '1'
        run: eas init --account kurtis-hypnotic-event --non-interactive --force

      - name: Submit Android preview APK build
        id: submit
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform android --profile preview --non-interactive --no-wait --json > /tmp/eas-build.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/eas-build.json', 'utf8'));
          const build = Array.isArray(payload) ? payload[0] : payload;
          if (!build?.id) throw new Error('EAS did not return a build id');
          const owner = build.project?.ownerAccount?.name || 'kurtis-hypnotic-event';
          const slug = build.project?.slug || 'kurtis-hypnotic-events';
          console.log(`EAS_BUILD_ID=${build.id}`);
          console.log(`EAS_STATUS=${build.status || 'UNKNOWN'}`);
          console.log(`EAS_GIT_COMMIT=${build.gitCommitHash || 'unknown'}`);
          console.log(`EAS_BUILD_PROFILE=${build.buildProfile || 'preview'}`);
          console.log(`EAS_BUILD_URL=https://expo.dev/accounts/${owner}/projects/${slug}/builds/${build.id}`);
          NODE
