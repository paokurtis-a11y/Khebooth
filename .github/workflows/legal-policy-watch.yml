name: KHE Legal Policy Watch

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  legal-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check legal profiles and official sources
        id: legal
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import pathlib
          import re
          import urllib.request

          root = pathlib.Path('.')
          registry = json.loads((root / 'config/legal-sources.json').read_text())
          cadence = int(registry.get('reviewCadenceDays', 30))
          policy = (root / 'apps/web/lib/legal-policies.ts').read_text()
          today = dt.date.today()
          problems = []

          reviewed = re.findall(r"lastReviewed:\s*'([0-9]{4}-[0-9]{2}-[0-9]{2})'", policy)
          if not reviewed:
              problems.append('Aucune date lastReviewed trouvée dans le registre juridique.')
          for value in sorted(set(reviewed)):
              reviewed_at = dt.date.fromisoformat(value)
              age = (today - reviewed_at).days
              if age > cadence:
                  problems.append(f'Profil juridique non revu depuis {age} jours (dernière revue {value}, cadence {cadence} jours).')

          for source in registry.get('sources', []):
              url = source['url']
              name = source['name']
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'KHE-Booth-Legal-Watch/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      status = getattr(response, 'status', 200)
                      if status >= 400:
                          problems.append(f'{name}: source officielle HTTP {status} — {url}')
              except Exception as exc:
                  problems.append(f'{name}: source officielle inaccessible — {url} — {type(exc).__name__}')

          report = ['# KHE Booth — veille juridique automatique', '', f'Date du contrôle: {today.isoformat()}', '']
          if problems:
              report += ['## Revue requise', ''] + [f'- {item}' for item in problems]
          else:
              report += ['## État', '', '- Profils juridiques dans la fenêtre de revue.', '- Sources officielles principales accessibles.']
          report += ['', 'Ce contrôle automatise la détection de fraîcheur et de disponibilité des sources. Toute modification juridique substantielle doit être validée avant publication dans KHE Booth.']
          pathlib.Path('legal-watch-report.md').write_text('\n'.join(report))

          with open(__import__('os').environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"needs_review={'true' if problems else 'false'}\n")
          PY

      - name: Publish watch report
        uses: actions/upload-artifact@v4
        with:
          name: legal-policy-watch-report
          path: legal-watch-report.md
          retention-days: 30

      - name: Open compliance review issue when needed
        if: steps.legal.outputs.needs_review == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('legal-watch-report.md', 'utf8');
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'legal-watch',
              per_page: 20
            });
            if (!data.some(issue => issue.title === 'KHE Booth — revue juridique requise')) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'KHE Booth — revue juridique requise',
                body,
                labels: ['legal-watch']
              });
            }
