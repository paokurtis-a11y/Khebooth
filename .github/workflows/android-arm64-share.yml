name: KHE Booth Android ARM64 Standalone

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-arm64-share.yml'

permissions:
  contents: read

jobs:
  build-arm64-standalone-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @khe/contracts build

      - name: Prebuild Android beta
        working-directory: apps/mobile
        env:
          CI: '1'
          NODE_ENV: production
          KHE_ANDROID_CHANNEL: beta
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Restrict APK to ARM64 only
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          pattern = r'(\n\s*defaultConfig\s*\{\s*\n)'
          replacement = r'\1        ndk { abiFilters "arm64-v8a" }\n'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not inject ARM64 abiFilters into app/build.gradle')
          gradle.write_text(text)

          props = Path('android/gradle.properties')
          ptext = props.read_text()
          if re.search(r'(?m)^reactNativeArchitectures=', ptext):
              ptext = re.sub(r'(?m)^reactNativeArchitectures=.*$', 'reactNativeArchitectures=arm64-v8a', ptext)
          else:
              ptext += '\nreactNativeArchitectures=arm64-v8a\n'
          props.write_text(ptext)
          PY

      - name: Compile standalone ARM64 release APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Prepare installable standalone APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          SOURCE_APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$SOURCE_APK"
          OUTPUT_APK='KHE-Booth-Android-ARM64-Standalone.apk'

          if "$APKSIGNER" verify "$SOURCE_APK" >/dev/null 2>&1; then
            cp "$SOURCE_APK" "$OUTPUT_APK"
          else
            test -f android/app/debug.keystore
            "$ZIPALIGN" -f 4 "$SOURCE_APK" /tmp/khe-aligned.apk
            "$APKSIGNER" sign \
              --ks android/app/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$OUTPUT_APK" \
              /tmp/khe-aligned.apk
          fi

          "$APKSIGNER" verify --verbose "$OUTPUT_APK"

      - name: Verify standalone bundle and ARM64 architecture
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          APK='KHE-Booth-Android-ARM64-Standalone.apk'
          unzip -l "$APK" | grep -E 'assets/(index\.android\.bundle|.*\.bundle)' >/dev/null
          unzip -l "$APK" | grep 'lib/arm64-v8a/' >/dev/null
          if unzip -l "$APK" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected non-ARM64 native libraries found.' >&2
            exit 1
          fi
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload standalone ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: KHE-Booth-Android-ARM64-Standalone
          path: apps/mobile/KHE-Booth-Android-ARM64-Standalone.apk
          if-no-files-found: error
          retention-days: 7
