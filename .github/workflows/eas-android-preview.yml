name: KHE Booth Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/mobile/.eas-build-trigger

permissions:
  contents: read
  statuses: write

concurrency:
  group: khe-booth-android-preview
  cancel-in-progress: false

jobs:
  build-android-preview:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Mark EAS APK pending
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'EAS Android APK',
              description: 'Android Preview APK is building on EAS',
              target_url: runUrl
            });

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Expo configuration
        working-directory: apps/mobile
        run: pnpm exec expo config --json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate pinned EAS project
        working-directory: apps/mobile
        run: eas project:info

      - name: Build and validate Android preview APK
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --non-interactive --wait --message "KHE Booth RC $GITHUB_SHA"

      - name: Mark EAS APK successful
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'EAS Android APK',
              description: 'Android Preview APK completed successfully',
              target_url: runUrl
            });

      - name: Mark EAS APK failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'EAS Android APK',
              description: 'Android Preview APK failed; inspect this Actions run',
              target_url: runUrl
            });
