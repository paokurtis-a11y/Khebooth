name: KHE Booth Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/mobile/.eas-build-trigger

permissions:
  contents: read

concurrency:
  group: khe-booth-android-preview
  cancel-in-progress: false

jobs:
  build-android-preview:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Expo configuration
        working-directory: apps/mobile
        run: pnpm exec expo config --json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link existing Expo project
        working-directory: apps/mobile
        env:
          EXPO_DEBUG: '1'
        run: eas init --account kurtis-hypnotic-event --non-interactive --force

      - name: Validate EAS project
        working-directory: apps/mobile
        run: eas project:info

      - name: Build and validate Android preview APK
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --non-interactive --wait --message "KHE Booth RC $GITHUB_SHA"
