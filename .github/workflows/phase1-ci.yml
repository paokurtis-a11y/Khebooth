name: KHE Booth CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: khe-booth-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: khe
          POSTGRES_PASSWORD: khe
          POSTGRES_DB: khe_booth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khe -d khe_booth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://khe:khe@localhost:5432/khe_booth_test?schema=public
      TEST_DATABASE_URL: postgresql://khe:khe@localhost:5432/khe_booth_test?schema=public
      JWT_SECRET: ci-secret-not-for-production
      JWT_EXPIRES_IN_SECONDS: 3600

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
