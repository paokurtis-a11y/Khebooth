name: Apply v0.3.0 legal patch

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-v030-legal-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-v030-legal-patch.mjs
      - name: Commit legal version alignment
        run: |
          if git diff --quiet -- apps/mobile/src/legal/legal-and-info.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/legal/legal-and-info.tsx
          git commit -m "chore(mobile): align legal revision with 0.3.0"
          git push origin HEAD:main
