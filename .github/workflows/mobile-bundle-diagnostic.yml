name: KHE Booth Mobile Bundle Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mobile-bundle-diagnostic.yml'
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  android-js-bundle:
    name: Reproduce Android JavaScript bundle
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @khebooth/contracts build

      - name: Bundle Android JavaScript
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://khebooth-api.vercel.app
        run: pnpm exec expo export --platform android --output-dir /tmp/khe-booth-export --clear
